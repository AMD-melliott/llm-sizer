services:
  # Static llm-sizer calculator SPA served by hardened nginx on port 8080.
  # Mirrors the SLAI App Platform deployment; browse http://localhost:8080/llm-sizer/.
  llm-sizer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: llm-sizer:latest
    container_name: llm-sizer
    ports:
      - "${LLM_SIZER_PORT:-8080}:8080"
    restart: unless-stopped
