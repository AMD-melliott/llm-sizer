# Default-deny namespace requires a per-app policy. Static site: allow ingress on
# the container port and only DNS egress (no DB, no OTLP — the page has no runtime
# backend). Ingress port MUST equal deployment.yaml containerPort (8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-sizer-net
  namespace: slai-app-prod
  labels:
    app.kubernetes.io/name: llm-sizer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-sizer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
