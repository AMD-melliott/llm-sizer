# Static SPA served under /llm-sizer/ on port 8080 by a non-root nginx with a
# read-only root filesystem. Writable paths (pid, caches) live under the
# in-memory emptyDir mounts declared in the k8s deployment: /run, /var/cache/nginx.
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # All temp paths must be writable under a read-only rootfs.
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Platform health probe (readiness/liveness in deployment.yaml).
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Hashed build assets — safe to cache aggressively.
    location /llm-sizer/assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA: serve files if present, otherwise fall back to the app entry point
    # so client-side routes resolve under the base path.
    location /llm-sizer/ {
      try_files $uri $uri/ /llm-sizer/index.html;
    }

    # Redirect bare root to the app's base path.
    location = / {
      return 302 /llm-sizer/;
    }
  }
}
